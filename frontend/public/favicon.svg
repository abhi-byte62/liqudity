<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#0d1117"/>
  <!-- Ask levels (top crimson) -->
  <rect x="5" y="6" width="22" height="2.5" rx="1" fill="#f85149" opacity="0.6"/>
  <rect x="9" y="10" width="18" height="2.5" rx="1" fill="#f85149"/>
  <!-- Central Mid Price line (cyan / white accent) -->
