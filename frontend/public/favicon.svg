  <!-- Bid levels (bottom green) -->
  <rect x="5" y="19.5" width="18" height="2.5" rx="1" fill="#3fb950"/>
  <rect x="5" y="23.5" width="22" height="2.5" rx="1" fill="#3fb950" opacity="0.6"/>
</svg>